name: Decompilation progress

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generated progress report
        run: python3 tools/progress.py --check

  # GitHub Pages is unavailable on a private repository outside Enterprise Cloud,
  # so the publish path is gated on the repo actually being public. Until then the
  # badge is served from docs/LEGOLANDPROGRESS.SVG in-tree and this job is skipped.
  pages:
    needs: report
    if: >-
      github.event_name == 'push'
      && github.repository == 'adamxbot/legoland'
      && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The portable build: every game source compiles with clang and the whole
  # archive links against the generated closure (portable/README.md). The
  # original binary is not available in CI, so globals are zero-initialised.
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build cmake
      - name: Configure
        run: cmake -S portable -B portable/build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release
      - name: Compile every game source
        run: ninja -C portable/build
      - name: Link the whole archive
        run: |
          ninja -C portable/build legoland_linkcheck
          ./portable/build/legoland_linkcheck
      - name: Link census
        run: python3 portable/tools/linkreport.py portable/build/CMakeFiles/legoland_core.dir --out portable/build/linkreport.md | head -14
      - uses: actions/upload-artifact@v4
        with:
          name: portable-linkreport
          path: portable/build/linkreport.md
