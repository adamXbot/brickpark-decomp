name: Decompilation progress

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generated progress report
        run: python3 tools/progress.py --check

  # GitHub Pages is unavailable on a private repository outside Enterprise Cloud,
  # so the publish path is gated on the repo actually being public. Until then the
  # badge is served from docs/LEGOLANDPROGRESS.SVG in-tree and this job is skipped.
  pages:
    needs: report
    if: >-
      github.event_name == 'push'
      && github.repository == 'adamxbot/legoland'
      && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The portable build: every game source compiles with clang and the whole
  # archive links against the generated closure (portable/README.md). The
  # original binary is not available in CI, so globals are zero-initialised.
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build cmake
      - name: Configure
        run: cmake -S portable -B portable/build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release
      - name: Compile every game source
        run: ninja -C portable/build
      - name: Link the whole archive
        run: |
          ninja -C portable/build legoland_linkcheck
          ./portable/build/legoland_linkcheck
      - name: Link census
        run: python3 portable/tools/linkreport.py portable/build/CMakeFiles/legoland_core.dir --out portable/build/linkreport.md | head -14
      - uses: actions/upload-artifact@v4
        with:
          name: portable-linkreport
          path: portable/build/linkreport.md

  # The wasm32 tree, which is the one that can actually RUN the game: wasm32 is
  # the only ILP32 target available, and every serialised layout in the recovered
  # code assumes 4-byte pointers and longs (portable/README.md, "ILP32 is the
  # real target"). The native job above is a compile-and-link census; this one
  # links the closure the browser and the headless harness use, and runs the
  # tests that need no game data.
  #
  # Neither gamedata/ nor original/legoland.exe is in the repository, so:
  #   * gen_link.py zero-fills every rebuilt global instead of initialising it
  #     from the exe's .data -- the link still closes, and nothing that depends
  #     on a shipped value is asserted here;
  #   * the asset-reading tests are not built at all and the oracles that decode
  #     a volume are not run (portable/cmake/tests.cmake decides this from
  #     gamedata/disc/Legoland.res, and says in its configure output which tests
  #     it registered and why). `headless_spine` is in that group: it needs the
  #     title artwork out of Graphics1.res.
  # So what this job gates is: every source compiles for wasm32, the whole
  # archive links against the generated closure for all five targets, the closure
  # resolves every symbol under node, and the four asset-free behaviour tests
  # pass. A wasm-ld signature mismatch or a binaryen validation failure breaks
  # the build here, which is the regression this job exists to catch
  # (docs/lanes/scope-port-a4.md).
  portable-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake
      # Pinned to the emsdk the tree is developed against (Homebrew emscripten
      # 6.0.9 locally). Keep this in step with portable/README.md's Build
      # section: a different emsdk can change the libc signatures gen_link.py's
      # CRT_PROTOS table is matched against, and that is exactly the class of
      # breakage this job catches.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9
          actions-cache-folder: emsdk-cache
      - name: Check the toolchain
        run: emcc --version
      # legoland_browser bakes its assets in with `--preload-file
      # $LL_GAMEDATA/main@/gamedata`, unconditionally, and emcc's file_packager
      # fails outright on a directory that does not exist -- so without this the
      # browser target cannot even be LINKED in CI. Pointing LL_GAMEDATA at an
      # empty tree and turning the 157 MB RES preload off links the real target
      # against an empty .data file, which is all this job needs: the browser
      # link is the one that runs ASYNCIFY and binaryen's directize, so it is the
      # link that catches an invalid module (docs/lanes/scope-port-m2.md §4).
      # The page cannot RUN from it, and is not asked to.
      # (A fetch backend instead of --preload-file is PORT-B's scope-port-b.md §6;
      # when that lands this whole step goes away.)
      - name: An empty asset tree, so the browser target can link
        run: |
          mkdir -p "${{ github.workspace }}/ci-gamedata/main"
          : > "${{ github.workspace }}/ci-gamedata/main/stab.str"
      - name: Configure wasm32 (ILP32)
        run: |
          emcmake cmake -S portable -B portable/build-wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLL_ILP32=ON \
            -DLL_GAMEDATA="${{ github.workspace }}/ci-gamedata" \
            -DLL_PRELOAD_RES=OFF
      - name: Compile every game source for wasm32
        run: ninja -C portable/build-wasm
      # 2>&1 | tee, then grep: wasm-ld prints a signature mismatch as a WARNING,
      # so the link succeeds and only the log says the module has a poisoned call
      # site. The grep is the gate.
      - name: Link every wasm32 target
        run: |
          ninja -C portable/build-wasm legoland_linkcheck legoland_headless \
                legoland_tests legoland_pathtest legoland_browser \
                2>&1 | tee /tmp/ll-wasm-link.log
      - name: No wasm-ld signature mismatches
        run: |
          if grep -n 'function signature mismatch' /tmp/ll-wasm-link.log; then
            echo "::error::wasm-ld reported a function signature mismatch:"
            echo "a call site is typed unlike the body it resolves to, and every"
            echo "call through it is a trapping stub. See docs/lanes/scope-port-m2.md"
            exit 1
          fi
          echo "no signature mismatches"
      - name: The closure resolves every symbol
        run: node portable/build-wasm/legoland_linkcheck.js
      # The ctest set here is the asset-free one: save_framing (a synthetic
      # script of framing operations), keystate (pure layout, gen_link's interior
      # aliases), rle_paint (nine synthetic cases; the tenth, one real shipped
      # sprite, skips itself with a named message) and anim_paint (its own
      # encoder). install_paths is in too -- its fixture is empty files whose
      # names mirror the install's mixed case, generated at configure time.
      - name: Run the tests that need no game data
        run: ctest --test-dir portable/build-wasm --output-on-failure
      - name: Link census (wasm32)
        run: |
          python3 portable/tools/linkreport.py \
            portable/build-wasm/CMakeFiles/legoland_core.dir \
            --out portable/build-wasm/linkreport.md | head -14
      - uses: actions/upload-artifact@v4
        with:
          name: portable-wasm-linkreport
          path: |
            portable/build-wasm/linkreport.md
            portable/build-wasm/gen/manifest.md
